[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mva-track1-solver"
version = "0.1.0"
description = "Local small-variant prioritization for MVA Hackathon 2026 Track 1"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mva-solver = "mva_solver.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
